<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Single-stage Tensor Core GEMM dataflow</title>
  <desc id="desc">A and B tiles move synchronously from global memory to shared memory, through ldmatrix into registers, then mma sync updates FP32 accumulators.</desc>
  <defs>
    <style>
      text{font-family:NanumGothic,sans-serif}.title{font-size:30px;font-weight:700;fill:#111827}.heading{font-size:20px;font-weight:700;fill:#111827}.body{font-size:16px;fill:#374151}.small{font-size:14px;fill:#4b5563}.mono{font-family:monospace;font-size:15px;fill:#111827}.box{stroke-width:2}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.barrier{stroke:#ef4444;stroke-width:3;stroke-dasharray:8 7}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker>
  </defs>
  <rect width="1280" height="650" fill="#f8fafc"/>
  <text x="55" y="58" class="title">첫 Tensor Core GEMM의 단일-stage dataflow</text>

  <rect x="55" y="130" width="190" height="170" rx="15" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="150" y="170" text-anchor="middle" class="heading">GMEM</text>
  <text x="150" y="210" text-anchor="middle" class="mono">A[64,32]</text>
  <text x="150" y="240" text-anchor="middle" class="mono">B[64,32]</text>
  <text x="150" y="275" text-anchor="middle" class="small">CTA의 현재 K tile</text>

  <path d="M245 215H345" class="arrow"/>
  <text x="295" y="190" text-anchor="middle" class="mono">128-bit copy</text>

  <rect x="345" y="130" width="205" height="170" rx="15" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="447" y="170" text-anchor="middle" class="heading">SMEM stage 0</text>
  <text x="447" y="210" text-anchor="middle" class="mono">sA[64,32]</text>
  <text x="447" y="240" text-anchor="middle" class="mono">sB[64,32]</text>
  <text x="447" y="275" text-anchor="middle" class="small">swizzled Layout</text>

  <line x1="582" y1="105" x2="582" y2="330" class="barrier"/>
  <text x="582" y="90" text-anchor="middle" class="small">sync_threads()</text>

  <path d="M550 215H675" class="arrow"/>
  <text x="612" y="190" text-anchor="middle" class="mono">ldmatrix.x4</text>

  <rect x="675" y="130" width="200" height="170" rx="15" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="775" y="170" text-anchor="middle" class="heading">RMEM fragments</text>
  <text x="775" y="210" text-anchor="middle" class="mono">tCrA · tCrB</text>
  <text x="775" y="240" text-anchor="middle" class="small">lane별 operand</text>
  <text x="775" y="266" text-anchor="middle" class="small">fragment</text>

  <path d="M875 215H965" class="arrow"/>
  <text x="920" y="190" text-anchor="middle" class="mono">mma.sync</text>

  <rect x="965" y="130" width="245" height="170" rx="15" fill="#f3e8ff" stroke="#9333ea" class="box"/>
  <text x="1087" y="170" text-anchor="middle" class="heading">FP32 accumulator</text>
  <text x="1087" y="210" text-anchor="middle" class="mono">tCrC</text>
  <text x="1087" y="240" text-anchor="middle" class="small">C[64,64]을 4 warps에</text>
  <text x="1087" y="266" text-anchor="middle" class="small">분산해 누적</text>

  <path d="M1087 300V405" class="arrow"/>
  <rect x="930" y="405" width="315" height="120" rx="15" fill="#fee2e2" stroke="#dc2626" class="box"/>
  <text x="1087" y="445" text-anchor="middle" class="heading">BF16 C in GMEM</text>
  <text x="1087" y="480" text-anchor="middle" class="body">lane fragment를 직접 store</text>
  <text x="1087" y="506" text-anchor="middle" class="small">Chapter 10에서 epilogue staging으로 교체</text>

  <rect x="55" y="390" width="720" height="160" rx="15" fill="#fff" stroke="#94a3b8" class="box"/>
  <text x="85" y="430" class="heading">K tile마다 반복</text>
  <text x="85" y="470" class="mono">copy → sync → ldmatrix → mma.sync → sync</text>
  <text x="85" y="508" class="body">Data load와 MMA가 겹치지 않아 구조는 단순하지만 latency가 그대로 노출된다.</text>
</svg>
