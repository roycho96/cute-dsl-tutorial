<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CuTe DSL의 세 실행 경계</title>
  <desc id="desc">Python driver가 DLPack tensor view를 만들고 CuTe JIT host launcher를 compile한 뒤 GPU kernel을 launch하는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="python" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="jit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, Pretendard, "Noto Sans KR", "DejaVu Sans", sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #475569; }
      .box-title { font-size: 20px; font-weight: 700; fill: white; }
      .box-code { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 600; fill: white; }
      .box-text { font-size: 14px; font-weight: 500; fill: #e2e8f0; }
      .arrow-label { font-size: 13px; font-weight: 600; fill: #334155; }
      .memory-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .memory-text { font-size: 13px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="title">CuTe DSL의 세 실행 경계</text>
  <text x="60" y="86" class="subtitle">한 Python 파일 안의 코드가 같은 시점, 같은 장치에서 실행되는 것은 아니다.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="300" height="230" rx="18" fill="url(#python)"/>
    <rect x="450" y="130" width="300" height="230" rx="18" fill="url(#jit)"/>
    <rect x="840" y="130" width="300" height="230" rx="18" fill="url(#gpu)"/>
  </g>

  <text x="88" y="172" class="box-title">1. Python driver</text>
  <text x="88" y="210" class="box-code">torch.Tensor</text>
  <text x="88" y="242" class="box-code">from_dlpack(...)</text>
  <text x="88" y="274" class="box-code">cute.compile(...)</text>
  <line x1="88" y1="298" x2="332" y2="298" stroke="#93c5fd" stroke-opacity="0.7"/>
  <text x="88" y="326" class="box-text">입력 준비 · compile 요청 · 결과 검증</text>

  <text x="478" y="172" class="box-title">2. JIT host launcher</text>
  <text x="478" y="210" class="box-code">@cute.jit</text>
  <text x="478" y="242" class="box-code">shape / layout</text>
  <text x="478" y="274" class="box-code">grid / block / launch</text>
  <line x1="478" y1="298" x2="722" y2="298" stroke="#c4b5fd" stroke-opacity="0.7"/>
  <text x="478" y="326" class="box-text">specialization · host-side launch 구성</text>

  <text x="868" y="172" class="box-title">3. GPU kernel</text>
  <text x="868" y="210" class="box-code">@cute.kernel</text>
  <text x="868" y="242" class="box-code">thread / block index</text>
  <text x="868" y="274" class="box-code">load · compute · store</text>
  <line x1="868" y1="298" x2="1112" y2="298" stroke="#6ee7b7" stroke-opacity="0.7"/>
  <text x="868" y="326" class="box-text">GPU thread가 실제 tensor 값을 처리</text>

  <path d="M 360 220 C 392 220, 418 220, 450 220" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="368" y="185" width="74" height="25" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="405" y="202" text-anchor="middle" class="arrow-label">compile</text>

  <path d="M 750 220 C 782 220, 808 220, 840 220" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="763" y="185" width="64" height="25" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="795" y="202" text-anchor="middle" class="arrow-label">launch</text>

  <g filter="url(#shadow)">
    <rect x="165" y="410" width="870" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="205" cy="445" r="15" fill="#f59e0b"/>
  <path d="M 197 445 h16 M 205 437 v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="235" y="440" class="memory-title">하나의 CUDA allocation</text>
  <text x="235" y="462" class="memory-text">PyTorch tensor와 CuTe tensor가 DLPack view로 같은 device memory를 공유한다. 변환 자체는 copy가 아니다.</text>
  <path d="M 210 410 C 210 390, 210 380, 210 360" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 990 410 C 990 390, 990 380, 990 360" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
</svg>
