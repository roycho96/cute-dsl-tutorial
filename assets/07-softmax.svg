<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Three-pass row-wise softmax</title>
  <desc id="desc">One thread block processes one row in three passes: maximum, exponential sum, and normalization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 18px Inter, Arial, sans-serif; fill: #94a3b8; }
      .stage { font: 700 22px Inter, Arial, sans-serif; fill: #f8fafc; }
      .code { font: 600 18px "SFMono-Regular", Consolas, monospace; fill: #e2e8f0; }
      .label { font: 500 17px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 500 15px Inter, Arial, sans-serif; fill: #94a3b8; }
      .thread { font: 600 15px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Row-wise softmax: one block, three passes</text>
  <text x="70" y="108" class="subtitle">grid.x = M rows · block.x = 256 threads · thread t visits t, t + 256, …</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="380" height="500" rx="22" fill="#172033" stroke="#334155"/>
    <rect x="510" y="155" width="380" height="500" rx="22" fill="#172033" stroke="#334155"/>
    <rect x="950" y="155" width="380" height="500" rx="22" fill="#172033" stroke="#334155"/>
  </g>

  <circle cx="112" cy="205" r="22" fill="#38bdf8"/>
  <text x="105" y="212" class="thread">1</text>
  <text x="150" y="213" class="stage">Find the row maximum</text>
  <text x="105" y="260" class="code">local_max</text>
  <text x="105" y="292" class="label">Each thread scans its columns.</text>

  <g transform="translate(105 330)">
    <rect x="0" y="0" width="54" height="54" rx="8" fill="#38bdf8"/><text x="15" y="34" class="thread">t</text>
    <rect x="64" y="0" width="54" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="76" y="34" class="small">…</text>
    <rect x="128" y="0" width="76" height="54" rx="8" fill="#38bdf8"/><text x="139" y="34" class="thread">t+256</text>
    <rect x="214" y="0" width="54" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="226" y="34" class="small">…</text>
    <rect x="278" y="0" width="62" height="54" rx="8" fill="#38bdf8"/><text x="284" y="34" class="thread">t+512</text>
  </g>
  <path d="M 120 430 C 170 480, 330 480, 380 430" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="135" y="517" class="code">block_reduce_max(...)</text>
  <rect x="105" y="548" width="310" height="67" rx="12" fill="#0f2d3f" stroke="#38bdf8"/>
  <text x="142" y="590" class="code">m = max(x[row, :])</text>

  <path d="M 455 405 L 500 405" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="552" cy="205" r="22" fill="#a78bfa"/>
  <text x="545" y="212" class="thread">2</text>
  <text x="590" y="213" class="stage">Sum shifted exponentials</text>
  <text x="545" y="260" class="code">exp(x - m)</text>
  <text x="545" y="292" class="label">Subtracting m keeps exp finite.</text>

  <g transform="translate(545 330)">
    <rect x="0" y="0" width="58" height="54" rx="8" fill="#a78bfa"/><text x="12" y="34" class="thread">e₀</text>
    <rect x="68" y="0" width="58" height="54" rx="8" fill="#a78bfa"/><text x="80" y="34" class="thread">e₁</text>
    <rect x="136" y="0" width="58" height="54" rx="8" fill="#a78bfa"/><text x="148" y="34" class="thread">e₂</text>
    <rect x="204" y="0" width="54" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="216" y="34" class="small">…</text>
    <rect x="268" y="0" width="58" height="54" rx="8" fill="#a78bfa"/><text x="280" y="34" class="thread">eₙ</text>
  </g>
  <path d="M 560 430 C 610 480, 770 480, 820 430" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="575" y="517" class="code">block_reduce_sum(...)</text>
  <rect x="545" y="548" width="310" height="67" rx="12" fill="#2a2044" stroke="#a78bfa"/>
  <text x="573" y="590" class="code">s = Σ exp(xᵢ - m)</text>

  <path d="M 895 405 L 940 405" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="992" cy="205" r="22" fill="#34d399"/>
  <text x="985" y="212" class="thread">3</text>
  <text x="1030" y="213" class="stage">Normalize</text>
  <text x="985" y="260" class="code">out = exp(x - m) / s</text>
  <text x="985" y="292" class="label">Threads revisit the same columns.</text>

  <g transform="translate(985 330)">
    <rect x="0" y="0" width="58" height="54" rx="8" fill="#34d399"/><text x="12" y="34" class="thread">y₀</text>
    <rect x="68" y="0" width="58" height="54" rx="8" fill="#34d399"/><text x="80" y="34" class="thread">y₁</text>
    <rect x="136" y="0" width="58" height="54" rx="8" fill="#34d399"/><text x="148" y="34" class="thread">y₂</text>
    <rect x="204" y="0" width="54" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="216" y="34" class="small">…</text>
    <rect x="268" y="0" width="58" height="54" rx="8" fill="#34d399"/><text x="280" y="34" class="thread">yₙ</text>
  </g>
  <text x="1040" y="482" class="code">0 ≤ yᵢ ≤ 1</text>
  <rect x="985" y="548" width="310" height="67" rx="12" fill="#12372f" stroke="#34d399"/>
  <text x="1080" y="590" class="code">Σ yᵢ = 1</text>

  <text x="70" y="713" class="small">The same nine-FP32 shared scratch stores eight warp results and one block result.</text>
</svg>
