<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Row-major and column-major Layouts</title>
  <desc id="desc">Two layouts with Shape (2, 3). Row-major uses Stride (3, 1), while column-major uses Stride (1, 2). Each cell shows its coordinate and resulting offset.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="rowHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="colHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .coord { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 14px; fill: #64748b; }
      .offset { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 30px; font-weight: 750; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1300" height="760" fill="#f8fafc"/>
  <text x="64" y="61" class="sans" font-size="18" font-weight="750" fill="#0f172a" letter-spacing="0.1em">LAYOUT MAPS COORDINATES TO OFFSETS</text>
  <text x="64" y="105" class="mono" font-size="26" font-weight="700" fill="#334155">L(coord) = coord · stride</text>
  <rect x="965" y="61" width="271" height="50" rx="25" fill="#e2e8f0"/>
  <text x="1100" y="92" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#334155">Shape = (2, 3)</text>

  <g filter="url(#shadow)">
    <rect x="64" y="148" width="564" height="480" rx="24" fill="#ffffff"/>
    <rect x="64" y="148" width="564" height="102" rx="24" fill="url(#rowHeader)"/>
    <path d="M64 224H628V250H64Z" fill="url(#rowHeader)"/>
  </g>
  <text x="96" y="190" class="sans" font-size="16" font-weight="750" fill="#dbeafe" letter-spacing="0.11em">ROW-MAJOR</text>
  <text x="96" y="227" class="mono" font-size="26" font-weight="700" fill="#ffffff">(2, 3):(3, 1)</text>
  <rect x="462" y="172" width="134" height="48" rx="24" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.42"/>
  <text x="529" y="202" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#ffffff">col stride = 1</text>

  <g>
    <rect x="103" y="298" width="148" height="102" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="119" y="324" class="coord">(0, 0)</text><text x="177" y="372" text-anchor="middle" class="offset">0</text>
    <rect x="272" y="298" width="148" height="102" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="288" y="324" class="coord">(0, 1)</text><text x="346" y="372" text-anchor="middle" class="offset">1</text>
    <rect x="441" y="298" width="148" height="102" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="457" y="324" class="coord">(0, 2)</text><text x="515" y="372" text-anchor="middle" class="offset">2</text>
    <rect x="103" y="421" width="148" height="102" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="119" y="447" class="coord">(1, 0)</text><text x="177" y="495" text-anchor="middle" class="offset">3</text>
    <rect x="272" y="421" width="148" height="102" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="288" y="447" class="coord">(1, 1)</text><text x="346" y="495" text-anchor="middle" class="offset">4</text>
    <rect x="441" y="421" width="148" height="102" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="457" y="447" class="coord">(1, 2)</text><text x="515" y="495" text-anchor="middle" class="offset">5</text>
  </g>
  <path d="M188 406H504" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.55"/>
  <text x="346" y="574" text-anchor="middle" class="mono" font-size="19" font-weight="700" fill="#1d4ed8">offset = row × 3 + col</text>
  <text x="346" y="601" text-anchor="middle" class="sans" font-size="14" fill="#64748b">The N mode changes fastest.</text>

  <g filter="url(#shadow)">
    <rect x="672" y="148" width="564" height="480" rx="24" fill="#ffffff"/>
    <rect x="672" y="148" width="564" height="102" rx="24" fill="url(#colHeader)"/>
    <path d="M672 224H1236V250H672Z" fill="url(#colHeader)"/>
  </g>
  <text x="704" y="190" class="sans" font-size="16" font-weight="750" fill="#f3e8ff" letter-spacing="0.11em">COLUMN-MAJOR</text>
  <text x="704" y="227" class="mono" font-size="26" font-weight="700" fill="#ffffff">(2, 3):(1, 2)</text>
  <rect x="1070" y="172" width="134" height="48" rx="24" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.42"/>
  <text x="1137" y="202" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#ffffff">row stride = 1</text>

  <g>
    <rect x="711" y="298" width="148" height="102" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="727" y="324" class="coord">(0, 0)</text><text x="785" y="372" text-anchor="middle" class="offset">0</text>
    <rect x="880" y="298" width="148" height="102" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="896" y="324" class="coord">(0, 1)</text><text x="954" y="372" text-anchor="middle" class="offset">2</text>
    <rect x="1049" y="298" width="148" height="102" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="1065" y="324" class="coord">(0, 2)</text><text x="1123" y="372" text-anchor="middle" class="offset">4</text>
    <rect x="711" y="421" width="148" height="102" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="727" y="447" class="coord">(1, 0)</text><text x="785" y="495" text-anchor="middle" class="offset">1</text>
    <rect x="880" y="421" width="148" height="102" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="896" y="447" class="coord">(1, 1)</text><text x="954" y="495" text-anchor="middle" class="offset">3</text>
    <rect x="1049" y="421" width="148" height="102" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <text x="1065" y="447" class="coord">(1, 2)</text><text x="1123" y="495" text-anchor="middle" class="offset">5</text>
  </g>
  <path d="M869 349H1038" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.55"/>
  <path d="M869 472H1038" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.55"/>
  <text x="954" y="574" text-anchor="middle" class="mono" font-size="19" font-weight="700" fill="#7e22ce">offset = row + col × 2</text>
  <text x="954" y="601" text-anchor="middle" class="sans" font-size="14" fill="#64748b">The M mode changes fastest.</text>

  <rect x="64" y="666" width="1172" height="58" rx="18" fill="#0f172a"/>
  <circle cx="102" cy="695" r="12" fill="#22c55e"/>
  <path d="M97 695L101 699L108 691" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="701" class="sans" font-size="17" font-weight="700" fill="#ffffff">Shape defines valid coordinates. Stride defines the offset map.</text>
</svg>
