<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Shared-memory tiled matrix transpose</title>
  <desc id="desc">Threads load rows from a global-memory tile into a padded shared-memory tile, synchronize, then read the tile with exchanged coordinates and write contiguous rows to the transposed output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="smem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .label { font-size: 16px; font-weight: 750; }
      .cell { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="64" y="62" class="sans" font-size="17" font-weight="750" fill="#0f172a" letter-spacing="0.11em">TILED TRANSPOSE</text>
  <text x="64" y="105" class="mono" font-size="27" font-weight="700" fill="#334155">global row → shared tile → global row</text>

  <g filter="url(#shadow)">
    <rect x="64" y="158" width="350" height="450" rx="24" fill="#ffffff"/>
  </g>
  <text x="96" y="202" class="sans label" fill="#1d4ed8">Input tile · 32 × 32</text>
  <text x="96" y="230" class="mono" font-size="15" fill="#475569">src[row, col]</text>
  <g stroke="#bfdbfe" fill="#eff6ff">
    <rect x="96" y="260" width="64" height="52"/><rect x="160" y="260" width="64" height="52"/><rect x="224" y="260" width="64" height="52"/><rect x="288" y="260" width="64" height="52"/>
    <rect x="96" y="312" width="64" height="52"/><rect x="160" y="312" width="64" height="52"/><rect x="224" y="312" width="64" height="52"/><rect x="288" y="312" width="64" height="52"/>
    <rect x="96" y="364" width="64" height="52"/><rect x="160" y="364" width="64" height="52"/><rect x="224" y="364" width="64" height="52"/><rect x="288" y="364" width="64" height="52"/>
    <rect x="96" y="416" width="64" height="52"/><rect x="160" y="416" width="64" height="52"/><rect x="224" y="416" width="64" height="52"/><rect x="288" y="416" width="64" height="52"/>
  </g>
  <g class="mono cell" text-anchor="middle" fill="#1e40af">
    <text x="128" y="292">0,0</text><text x="192" y="292">0,1</text><text x="256" y="292">0,2</text><text x="320" y="292">…</text>
    <text x="128" y="344">1,0</text><text x="192" y="344">1,1</text><text x="256" y="344">1,2</text><text x="320" y="344">…</text>
    <text x="128" y="396">2,0</text><text x="192" y="396">2,1</text><text x="256" y="396">2,2</text><text x="320" y="396">…</text>
    <text x="128" y="448">…</text><text x="192" y="448">…</text><text x="256" y="448">…</text><text x="320" y="448">…</text>
  </g>
  <rect x="96" y="510" width="256" height="60" rx="12" fill="#dbeafe"/>
  <text x="224" y="536" text-anchor="middle" class="sans label" fill="#1e40af">coalesced load</text>
  <text x="224" y="558" text-anchor="middle" class="mono" font-size="14" fill="#1d4ed8">adjacent tx → adjacent col</text>

  <path d="M424 374H492" stroke="#38bdf8" stroke-width="4"/>
  <text x="458" y="354" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0369a1">GMEM → SMEM</text>

  <g filter="url(#shadow)">
    <rect x="502" y="134" width="396" height="500" rx="24" fill="#ffffff"/>
    <rect x="502" y="134" width="396" height="96" rx="24" fill="url(#smem)"/>
    <path d="M502 206H898V230H502Z" fill="url(#smem)"/>
  </g>
  <text x="534" y="176" class="sans" font-size="15" font-weight="750" fill="#f3e8ff" letter-spacing="0.08em">SHARED MEMORY</text>
  <text x="534" y="210" class="mono" font-size="22" font-weight="700" fill="#ffffff">(32, 33):(33, 1)</text>
  <text x="534" y="268" class="sans label" fill="#6b21a8">32 data columns + 1 padding column</text>
  <g stroke="#d8b4fe" fill="#faf5ff">
    <rect x="534" y="294" width="70" height="54"/><rect x="604" y="294" width="70" height="54"/><rect x="674" y="294" width="70" height="54"/><rect x="744" y="294" width="70" height="54"/><rect x="814" y="294" width="52" height="54" fill="#fce7f3"/>
    <rect x="534" y="348" width="70" height="54"/><rect x="604" y="348" width="70" height="54"/><rect x="674" y="348" width="70" height="54"/><rect x="744" y="348" width="70" height="54"/><rect x="814" y="348" width="52" height="54" fill="#fce7f3"/>
    <rect x="534" y="402" width="70" height="54"/><rect x="604" y="402" width="70" height="54"/><rect x="674" y="402" width="70" height="54"/><rect x="744" y="402" width="70" height="54"/><rect x="814" y="402" width="52" height="54" fill="#fce7f3"/>
  </g>
  <g class="mono cell" text-anchor="middle" fill="#7e22ce">
    <text x="569" y="328">0,0</text><text x="639" y="328">0,1</text><text x="709" y="328">0,2</text><text x="779" y="328">…</text><text x="840" y="328" fill="#be185d">pad</text>
    <text x="569" y="382">1,0</text><text x="639" y="382">1,1</text><text x="709" y="382">1,2</text><text x="779" y="382">…</text><text x="840" y="382" fill="#be185d">pad</text>
    <text x="569" y="436">2,0</text><text x="639" y="436">2,1</text><text x="709" y="436">2,2</text><text x="779" y="436">…</text><text x="840" y="436" fill="#be185d">pad</text>
  </g>
  <rect x="534" y="492" width="332" height="92" rx="14" fill="#f5f3ff"/>
  <text x="700" y="523" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#6d28d9">sync_threads()</text>
  <text x="700" y="549" text-anchor="middle" class="sans" font-size="14" font-weight="650" fill="#475569">all stores finish before transposed reads</text>
  <text x="700" y="571" text-anchor="middle" class="mono" font-size="14" fill="#7e22ce">tile[tx, ty + offset]</text>

  <path d="M908 374H976" stroke="#ec4899" stroke-width="4"/>
  <text x="942" y="354" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#be185d">SMEM → GMEM</text>

  <g filter="url(#shadow)">
    <rect x="986" y="158" width="350" height="450" rx="24" fill="#ffffff"/>
  </g>
  <text x="1018" y="202" class="sans label" fill="#be185d">Output tile · 32 × 32</text>
  <text x="1018" y="230" class="mono" font-size="15" fill="#475569">dst[col, row]</text>
  <g stroke="#fbcfe8" fill="#fdf2f8">
    <rect x="1018" y="260" width="64" height="52"/><rect x="1082" y="260" width="64" height="52"/><rect x="1146" y="260" width="64" height="52"/><rect x="1210" y="260" width="64" height="52"/>
    <rect x="1018" y="312" width="64" height="52"/><rect x="1082" y="312" width="64" height="52"/><rect x="1146" y="312" width="64" height="52"/><rect x="1210" y="312" width="64" height="52"/>
    <rect x="1018" y="364" width="64" height="52"/><rect x="1082" y="364" width="64" height="52"/><rect x="1146" y="364" width="64" height="52"/><rect x="1210" y="364" width="64" height="52"/>
    <rect x="1018" y="416" width="64" height="52"/><rect x="1082" y="416" width="64" height="52"/><rect x="1146" y="416" width="64" height="52"/><rect x="1210" y="416" width="64" height="52"/>
  </g>
  <g class="mono cell" text-anchor="middle" fill="#9d174d">
    <text x="1050" y="292">0,0</text><text x="1114" y="292">1,0</text><text x="1178" y="292">2,0</text><text x="1242" y="292">…</text>
    <text x="1050" y="344">0,1</text><text x="1114" y="344">1,1</text><text x="1178" y="344">2,1</text><text x="1242" y="344">…</text>
    <text x="1050" y="396">0,2</text><text x="1114" y="396">1,2</text><text x="1178" y="396">2,2</text><text x="1242" y="396">…</text>
    <text x="1050" y="448">…</text><text x="1114" y="448">…</text><text x="1178" y="448">…</text><text x="1242" y="448">…</text>
  </g>
  <rect x="1018" y="510" width="256" height="60" rx="12" fill="#fce7f3"/>
  <text x="1146" y="536" text-anchor="middle" class="sans label" fill="#9d174d">coalesced store</text>
  <text x="1146" y="558" text-anchor="middle" class="mono" font-size="14" fill="#be185d">adjacent tx → adjacent out_col</text>

  <text x="700" y="701" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#475569">The 33-element row stride changes the shared-memory bank for each successive row.</text>
</svg>
